# /etc/systemd/system/getty@tty1.service.d/autologin.conf
# Logs the "console" user in on tty1 at boot, no password prompt.
#
# If the framebuffer is bigger than the mode the CRT actually gets (see the
# README, HDMI to VGA adapters), size tty1 to the visible area first:
# 720x480 / an 8x16 font = 90 columns x 30 rows. Delete the line otherwise.
[Service]
ExecStartPre=/bin/stty -F /dev/tty1 rows 30 cols 90
ExecStart=
ExecStart=-/sbin/agetty --autologin console --noclear %I $TERM
